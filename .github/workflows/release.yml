# ============================================================================
# P0-4 FIX (audit 2026 §30 — "no verified signed release/AAB pipeline"):
# a REAL release pipeline: tagged builds produce a minified (R8), SIGNED AAB
# with artifact provenance (SHA-256) and a draft GitHub release. Signing
# material comes exclusively from repository secrets — never from the tree.
#
# Required repository secrets:
#   KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias (default: upload)
#   KEY_PASSWORD      key password
# ============================================================================
name: Release (signed AAB)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Verify committed Gradle wrapper (no unpinned substitutions)
      run: |
        chmod +x ./gradlew
        [ -f "gradle/wrapper/gradle-wrapper.jar" ] || { echo "::error::committed wrapper jar missing"; exit 1; }

    - name: Gate — release unit tests must pass BEFORE any artifact is signed
      run: |
        ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

    - name: Prepare .env from example (secrets plugin contract)
      run: cp .env.example .env

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 secret is missing — a signed release cannot be produced. Add the repository secrets documented in docs/RELEASE-SIGNING.md."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-key.jks
        ls -l upload-key.jks

    - name: Build SIGNED release AAB (R8 minified)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace

    - name: Artifact provenance (SHA-256 manifest)
      run: |
        cd app/build/outputs/bundle/release
        sha256sum *.aab | tee aab-sha256.txt
        cat aab-sha256.txt >> "$GITHUB_STEP_SUMMARY"

    - name: Upload signed AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-aab
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/bundle/release/aab-sha256.txt

    - name: Create draft GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        gh release create "$TAG" \
          --draft \
          --title "AI-V0 $TAG" \
          --notes "Signed release AAB (R8 minified). SHA-256 manifest attached. Verify against aab-sha256.txt before distribution." \
          app/build/outputs/bundle/release/*.aab \
          app/build/outputs/bundle/release/aab-sha256.txt
