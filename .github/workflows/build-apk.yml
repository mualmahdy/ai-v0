name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare environment files
        run: |
          # Ensure .env exists from .env.example if not present
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Ensure debug.keystore is decoded from base64 if not already present
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore debug.keystore -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          chmod +x ./gradlew || true
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK existence
        id: find-apk
        run: |
          echo "Listing generated APK files:"
          find app/build/outputs/apk/ -name "*.apk" -type f
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file was found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-v0-ultimate-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14
