name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21 (unified toolchain)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # P0-3 FIX (audit 2026 §30): the wrapper JAR is COMMITTED in this
    # repository (gradle/wrapper/gradle-wrapper.jar) — the previous job
    # curl'ed the wrapper from gradle/gradle@master, silently substituting
    # an UNVERIFIED, UNPINNED binary into the build (a supply-chain hole and
    # a source of build divergence). We now FAIL if the committed wrapper is
    # missing instead of downloading a different one.
    - name: Verify committed Gradle wrapper
      run: |
        chmod +x ./gradlew
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "::error::gradle/wrapper/gradle-wrapper.jar is missing from the repository — refusing to substitute an unpinned download."
          exit 1
        fi

    - name: Compile (fail fast on Kotlin errors)
      run: |
        ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

    # NOTE(workflow-YAML): a "name:" value containing ": " MUST be quoted —
    # an unquoted colon in a mapping value invalidates the whole workflow
    # file (GitHub fails the run before creating any job). This exact bug
    # made android.yml fail 52/52 runs since its introduction while the
    # deleted build-apk.yml silently remained the only APK producer.
    - name: "Unit tests (Phase 4 invariants: no silent fallback, single write authority, version bump)"
      run: |
        ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Build APK (assemble app module)
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    # P0-4 (audit 2026 §30 — no release pipeline): the PR gate now ALSO
    # proves the RELEASE variant builds (R8 minification, real keep rules,
    # AAB bundling) BEFORE release day. Unsigned here — the build.gradle.kts
    # release block only assigns a signing config when KEYSTORE_PATH is
    # provided (release.yml supplies it), so this step produces an honest
    # unsigned AAB and a CI proof that minification does not break the build.
    # (The previous empty android.injected.signing.* injection is removed —
    # it created a broken "externalOverride" signing config that failed
    # validateSigningRelease before this step could ever pass.)
    - name: Build Release AAB (minified, unsigned — release-readiness gate)
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace

    # The debug APK artifact keeps the naming convention of the deleted
    # build-apk.yml (the only workflow that ever delivered an APK from CI)
    # so existing download links/habits keep working: ai-v0-ultimate-debug-apk.
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-v0-ultimate-debug-apk
        path: app/build/outputs/**/*.apk
        retention-days: 14

    - name: Upload release AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab-unsigned
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 14

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/**
