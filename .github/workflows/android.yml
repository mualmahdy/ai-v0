name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Debug repo files
      run: |
        echo "Listing repo root:"
        ls -la
        echo "Listing app dir if exists:"
        ls -la app || true
        echo "Check for gradlew and debug.keystore:"
        [ -f "./gradlew" ] && echo "gradlew: present" || echo "gradlew: missing"
        [ -f "./debug.keystore" ] && echo "debug.keystore: present" || echo "debug.keystore: missing"

    - name: Ensure Gradle (wrapper or system)
      run: |
        if [ -f "./gradlew" ]; then
          echo "Found gradlew wrapper, will use it.";
        else
          echo "gradlew wrapper not found. Installing Gradle CLI via apt-get as a fallback.";
          sudo apt-get update && sudo apt-get install -y gradle;
        fi

    - name: Grant execute permission for gradlew (if exists)
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew;
        else
          echo "No gradlew to chmod; skipping.";
        fi

    - name: Ensure debug keystore exists (for signing)
      run: |
        if [ -f "${{ github.workspace }}/debug.keystore" ]; then
          echo "debug.keystore already present"
        else
          echo "Generating debug.keystore for CI"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
        fi

    - name: Build APK (assemble app module)
      run: |
        if [ -f "./gradlew" ]; then
          echo "Building with gradlew wrapper (module-specified)";
          ./gradlew :app:assembleDebug --no-daemon --stacktrace;
        else
          echo "Building with system gradle (module-specified)";
          gradle :app:assembleDebug --no-daemon --stacktrace;
        fi

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apks
        path: app/build/outputs/**/*.apk
