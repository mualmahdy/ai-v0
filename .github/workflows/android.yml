name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Debug repo files
      run: |
        echo "Listing repo root:"
        ls -la
        echo "Listing app dir if exists:"
        ls -la app || true
        echo "Check for gradlew and debug.keystore:"
        [ -f "./gradlew" ] && echo "gradlew: present" || echo "gradlew: missing"
        [ -f "./debug.keystore" ] && echo "debug.keystore: present" || echo "debug.keystore: missing"

    - name: Ensure Gradle Wrapper and Keystore
      run: |
        chmod +x ./gradlew || true
        mkdir -p gradle/wrapper
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Downloading gradle-wrapper.jar..."
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar || true
        fi
        if [ ! -f "debug.keystore" ]; then
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore for CI"
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore debug.keystore -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
        fi

    - name: Compile (fail fast on Kotlin errors)
      run: |
        ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

    - name: Unit tests (Phase 4 invariants: no silent fallback, single write authority, version bump)
      run: |
        ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Build APK (assemble app module)
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apks
        path: app/build/outputs/**/*.apk

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/**