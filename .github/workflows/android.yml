name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21 (unified toolchain)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # P0-3 FIX (audit 2026 §30): the wrapper JAR is COMMITTED in this
    # repository (gradle/wrapper/gradle-wrapper.jar) — the previous job
    # curl'ed the wrapper from gradle/gradle@master, silently substituting
    # an UNVERIFIED, UNPINNED binary into the build (a supply-chain hole and
    # a source of build divergence). We now FAIL if the committed wrapper is
    # missing instead of downloading a different one.
    - name: Verify committed Gradle wrapper
      run: |
        chmod +x ./gradlew
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "::error::gradle/wrapper/gradle-wrapper.jar is missing from the repository — refusing to substitute an unpinned download."
          exit 1
        fi

    - name: Compile (fail fast on Kotlin errors)
      run: |
        ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

    # NOTE(workflow-YAML): a "name:" value containing ": " MUST be quoted —
    # an unquoted colon in a mapping value invalidates the whole workflow
    # file (GitHub fails the run before creating any job). This exact bug
    # made android.yml fail 52/52 runs since its introduction while the
    # deleted build-apk.yml silently remained the only APK producer.
    - name: "Unit tests (Phase 4 invariants: no silent fallback, single write authority, version bump)"
      run: |
        ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    # DIAGNOSTIC (Sep 2026 — added while triaging a red "Unit tests" step):
    # this job's failures were previously visible ONLY by signing in to
    # GitHub — the raw step logs and the "test-reports" artifact both
    # require an authenticated session, and the public REST API is
    # rate-limited for unauthenticated callers. That made a failing run
    # effectively undiagnosable to anyone without repo access at the
    # keyboard. This step parses the JUnit XML Gradle already writes and
    # prints the failing class/test/message to the run's own Summary tab,
    # which renders for signed-out visitors too. It changes NOTHING about
    # whether tests pass — it only makes a red run legible without a login.
    - name: Summarize test failures (visible without signing in)
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import os
        import xml.etree.ElementTree as ET

        failures = []
        for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
            try:
                root = ET.parse(path).getroot()
            except ET.ParseError:
                continue
            suite = root.get("name", path)
            for testcase in root.findall("testcase"):
                for tag in ("failure", "error"):
                    node = testcase.find(tag)
                    if node is None:
                        continue
                    classname = testcase.get("classname", suite)
                    name = testcase.get("name", "?")
                    message = (node.get("message") or node.text or "").strip()
                    message = " ".join(message.split())[:300]
                    failures.append((classname, name, tag, message))

        lines = []
        if failures:
            lines.append("### Failing tests (" + str(len(failures)) + ")")
            lines.append("")
            lines.append("| Class | Test | Type | Message |")
            lines.append("|---|---|---|---|")
            for classname, name, tag, message in failures:
                message = message.replace("|", "\\|")
                lines.append("| `" + classname + "` | `" + name + "` | " + tag + " | " + message + " |")
        else:
            lines.append(
                "No JUnit XML under app/build/test-results/ -- the failure is "
                "most likely in an earlier step (wrapper check, compile, or "
                "a Gradle configuration error) rather than a test assertion. "
                "Check the job's Annotations for the failing step name."
            )

        report = "\n".join(lines) + "\n"
        print(report)

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write(report)
        PY

    - name: Build APK (assemble app module)
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    # P0-4 (audit 2026 §30 — no release pipeline): the PR gate now ALSO
    # proves the RELEASE variant builds (R8 minification, real keep rules,
    # AAB bundling) BEFORE release day. Unsigned here — the build.gradle.kts
    # release block only assigns a signing config when KEYSTORE_PATH is
    # provided (release.yml supplies it), so this step produces an honest
    # unsigned AAB and a CI proof that minification does not break the build.
    # (The previous empty android.injected.signing.* injection is removed —
    # it created a broken "externalOverride" signing config that failed
    # validateSigningRelease before this step could ever pass.)
    - name: Build Release AAB (minified, unsigned — release-readiness gate)
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace

    # The debug APK artifact keeps the naming convention of the deleted
    # build-apk.yml (the only workflow that ever delivered an APK from CI)
    # so existing download links/habits keep working: ai-v0-ultimate-debug-apk.
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-v0-ultimate-debug-apk
        path: app/build/outputs/**/*.apk
        retention-days: 14

    - name: Upload release AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab-unsigned
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 14

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/**
