name: E2E Device Tests (connectedDebugAndroidTest)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  e2e:
    name: Instrumentation E2E on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (unified toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare environment files
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore debug.keystore -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          # P0-3: the wrapper jar is COMMITTED — never substitute an unpinned download.
          chmod +x ./gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing from the repository."
            exit 1
          fi

      # REPORT GAP-CLOSURE ("E2E/device proof NOT SUFFICIENT"): the previous
      # CI ran compile + unit tests + assembleDebug only. This job runs the
      # instrumentation suite on a REAL emulator (API 34, x86_64) so the
      # launch → persistence → kill → reopen → resume path is actually
      # proven on a device-shaped environment.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-instrumentation-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
