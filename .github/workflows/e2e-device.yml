name: E2E Device Tests (connectedDebugAndroidTest)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  e2e:
    name: Instrumentation E2E on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (unified toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # FIX (Design Closure 2026 — slice 8): android-actions/setup-android@v3
      # began failing on the CURRENT ubuntu-latest runner image (the job
      # died at this very step on every push since slice 5 — runs for
      # 2429fb8 / 8695369 / a291d22 all show "Set up Android SDK -> failure"
      # with the instrumentation steps SKIPPED: the suite never executed,
      # so even the honest GAP-22 scope claim below was unverifiable).
      # The runner image ALREADY ships the Android SDK at ANDROID_HOME with
      # cmdline-tools — the action only ever added license acceptance on
      # top of that. We now accept the licenses directly on the
      # pre-installed SDK and let android-emulator-runner provision the
      # API-34 system image it needs (its documented behavior).
      - name: Accept Android SDK licenses (pre-installed runner SDK)
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER — the runner image changed."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --version

      - name: Prepare environment
        run: |
          # P0-3: the wrapper jar is COMMITTED — never substitute an unpinned download.
          chmod +x ./gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing from the repository."
            exit 1
          fi

      # GAP-22 (Design Closure 2026 — honest CI claims): this job runs the
      # INSTRUMENTATION suite (:app:connectedDebugAndroidTest) on a real API-34
      # x86_64 emulator. What that actually proves today: the DURABLE
      # substrate on a device-shaped environment — Room DAOs, DB reopen
      # after close(), workflow/agent row round-trips (DurableWorkspaceE2ETest),
      # plus the package-name smoke test. It does NOT (yet) prove UI launch,
      # navigation, workspace creation via UI, model connection, chat, a REAL
      # process kill (am kill / process death — the suite reopens the DB in
      # the SAME process), or UI resume. The full launch→navigate→chat→kill→
      # reopen→resume loop remains open and is tracked by the UI-redesign
      # track (GAP-21). (The previous comment overstated this as "the launch →
      # persistence → kill → reopen → resume path is actually proven".)
      # The vestigial root debug.keystore generation step was also removed —
      # the debug build type signs with the standard AGP auto-generated
      # keystore (FIX F-12), so no root keystore file is needed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-instrumentation-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
