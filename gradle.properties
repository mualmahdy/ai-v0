# P0-3 FIX (audit 2026 §30 — build fails at mergeExtDexDebug with Java heap
# space): the daemon heap was 1536m — too small for D8 dex merging this
# dependency set (Compose + icons-extended + Firebase + ONNX). 3g matches
# GitHub-hosted runners (7-16GB) and is safe on 4GB local machines (JVM heap
# is reserved lazily, not preallocated).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.enableJetifier=false
ksp.useKSP2=true
# org.gradle.java.home removed (machine-specific; use JAVA_HOME from environment)
